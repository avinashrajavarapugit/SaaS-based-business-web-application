name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify dependency hygiene
        run: node scripts/check-dependencies.mjs

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm -r test

  tenancy:
    name: Tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas -d saas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations and the app both run as the unprivileged role, so RLS applies.
      DATABASE_URL: postgresql://saas_app:saas_app@localhost:5432/saas_dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create the unprivileged application role
        run: psql "postgresql://saas:saas@localhost:5432/saas_dev" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql

      - name: Apply migrations and seed
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Prove tenant isolation holds
        working-directory: apps/api
        run: pnpm verify:tenancy
