name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas -d saas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Development machines here install through an internal mirror that lags
      # public npm, so the lockfile is authored on the runner instead. It is
      # committed at the end of this job, and only if everything below passed.
      - name: Install
        run: |
          if pnpm install --frozen-lockfile; then
            echo "lockfile_changed=false" >> "$GITHUB_ENV"
          else
            echo "Lockfile is stale; regenerating against the public registry."
            rm -f pnpm-lock.yaml
            pnpm install
            echo "lockfile_changed=true" >> "$GITHUB_ENV"
          fi

      - name: Verify dependency hygiene
        run: node scripts/check-dependencies.mjs

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # The API suite provisions its own saas_test database, so it only needs
      # the unprivileged role to exist first.
      - name: Create the unprivileged application role
        run: psql "postgresql://saas:saas@localhost:5432/saas_dev" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql

      - run: pnpm -r test

      - name: Commit the regenerated lockfile
        if: env.lockfile_changed == 'true' && github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "Lockfile did not actually change."
            exit 0
          fi
          # Attributed to the repository owner so it counts as their activity.
          git config user.name "Avinash Rajavarapu"
          git config user.email "179114570+avinashrajavarapugit@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm-lock.yaml from the public npm registry"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  tenancy:
    name: Tenant isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
          POSTGRES_DB: saas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saas -d saas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations and the app both run as the unprivileged role, so RLS applies.
      DATABASE_URL: postgresql://saas_app:saas_app@localhost:5432/saas_dev
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Tolerates a stale lockfile; the quality job is what enforces it.
      - run: pnpm install --no-frozen-lockfile

      - name: Create the unprivileged application role
        run: psql "postgresql://saas:saas@localhost:5432/saas_dev" -v ON_ERROR_STOP=1 -f infra/postgres/init.sql

      - name: Apply migrations and seed
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Prove tenant isolation holds
        working-directory: apps/api
        run: pnpm verify:tenancy
