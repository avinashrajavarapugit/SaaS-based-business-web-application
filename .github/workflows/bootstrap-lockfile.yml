name: Bootstrap lockfile

# The development machine reaches npm through an internal mirror that rewrites
# tarball URLs and integrity hashes, so a lockfile generated there is not
# portable. GitHub's runners resolve from the public registry, so the lockfile
# is generated here instead and committed back.

on:
  workflow_dispatch:
  # workflow_dispatch only works from the default branch, so this also runs when
  # dependencies change. The lockfile commit-back touches none of these paths,
  # so it cannot re-trigger the job.
  push:
    branches: [feat/v2-platform]
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Regenerate the lockfile from scratch
        # Deleted first: pnpm reuses satisfiable entries, so an existing lockfile
        # generated behind an internal mirror would survive untouched.
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only

      - name: Verify dependency hygiene
        run: node scripts/check-dependencies.mjs

      - name: Commit lockfile
        run: |
          if [ -z "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "Lockfile unchanged."
            exit 0
          fi
          # Attributed to the repository owner, not the bot, so the commit counts
          # towards their contribution graph.
          git config user.name "Avinash Rajavarapu"
          git config user.email "179114570+avinashrajavarapugit@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: generate pnpm-lock.yaml from the public npm registry"
          git push
