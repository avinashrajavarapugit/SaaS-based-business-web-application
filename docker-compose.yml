services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
      POSTGRES_DB: saas_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saas -d saas_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound mail in development; web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: saas-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
